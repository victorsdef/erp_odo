spring.application.name=odo-backend

# PostgreSQL — usa variables de entorno en Docker, fallback para local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/odo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:odo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:odo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:odo_super_secret_key_must_be_at_least_256_bits_long_for_security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:odo_minio_user}
minio.secret-key=${MINIO_SECRET_KEY:odo_minio_password}
minio.bucket=${MINIO_BUCKET:odo-perfil}

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.odo=DEBUG
