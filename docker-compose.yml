version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: odo_db
    environment:
      POSTGRES_DB: odo_db
      POSTGRES_USER: odo_user
      POSTGRES_PASSWORD: odo_password
    ports:
      - "5432:5432"
    volumes:
      - odo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odo_user -d odo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./odo-backend
    container_name: odo_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/odo_db
      SPRING_DATASOURCE_USERNAME: odo_user
      SPRING_DATASOURCE_PASSWORD: odo_password
      JWT_SECRET: odo_super_secret_key_must_be_at_least_256_bits_long_for_security
      JWT_EXPIRATION: 86400000
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  odo_pgdata:
